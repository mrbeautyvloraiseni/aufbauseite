<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quittung – MR Beauty</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;font-family:Arial,sans-serif;color:#111}.wrap{max-width:760px;margin:auto;background:#fff;min-height:100vh;padding:26px 24px 34px}.logo{display:block;margin:0 auto 10px;width:38%;max-width:160px}.company{text-align:center;font-size:14px;line-height:1.25}.dash{border-top:1px dashed #111;margin:10px 0 16px}.title{font-size:22px;font-weight:800;letter-spacing:1px;margin-bottom:16px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 30px}.meta>div:nth-child(even){text-align:left}.label{font-size:14px}.value{font-size:15px;font-weight:800}.line{border-top:2px solid #111;margin:15px 0}.items h2{font-size:18px;margin:0 0 12px}.item,.total{display:grid;grid-template-columns:minmax(0,1fr) 38px 78px;gap:4px;font-size:15px;margin:10px 0}.item .amt,.total .amt{text-align:right}.total{font-size:16px}.total .amt,.total .cur{font-weight:800}.pay{display:flex;justify-content:space-between;font-size:15px;margin-top:12px}.pay b{font-weight:800}.mwst{font-size:13px;margin-top:-2px}.thanks{text-align:center;margin-top:20px}.heart{font-size:34px;color:#c8cf04}.script{color:#c8cf04;font-size:24px;font-family:cursive}.sub{font-size:13px;margin-top:8px}.status{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:30px}.status h1{font-size:24px}.status p{color:#ddd}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script></head>
<body><div id="app" class="status"><div><h1>Quittung wird geladen…</h1></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBeUdo8xgLdwdMh-t2RU5z37Z6LIeZsXTQ",authDomain:"mr-beauty-apps.firebaseapp.com",projectId:"mr-beauty-apps",storageBucket:"mr-beauty-apps.firebasestorage.app"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fail(title,text){document.getElementById('app').className='status';document.getElementById('app').innerHTML=`<div><h1>${esc(title)}</h1><p>${esc(text)}</p></div>`}
(async()=>{try{
 const parts=location.pathname.split('/').filter(Boolean); const qi=parts.indexOf('q'); const token=qi>=0?parts[qi+1]:'';
 if(!/^\d{16}$/.test(token)){fail('Quittung nicht gefunden','Der Link ist unvollständig.');return}
 const snap=await db.collection('public_receipts').doc(token).get(); if(!snap.exists){fail('Quittung nicht gefunden','Dieser Beleg ist nicht vorhanden.');return}
 const d=snap.data()||{}; const items=Array.isArray(d.items)?d.items:[];
 document.getElementById('app').className='wrap'; document.getElementById('app').innerHTML=`
 <img class="logo" src="https://mrbeautyvloraiseni.github.io/kasse/logo_quittung.png" alt="MR Beauty">
 <div class="company">MR Beauty Vlora Iseni<br>Adlikerstrasse 255 | 8105 Regensdorf</div><div class="dash"></div>
 <div class="title">QUITTUNG</div><div class="meta">
 <div><div class="label">Quittung Nr.:</div><div class="value">${esc(d.receiptNumber)}</div></div>
 <div><div class="label">Datum:</div><div class="value">${esc(d.date)}</div></div>
 <div><div class="label">Kundin:</div><div class="value">${esc(d.customerName)}</div></div>
 <div><div class="label">Uhrzeit:</div><div class="value">${esc(d.time)}</div></div></div>
 <div class="line"></div><div class="items"><h2>Leistungen</h2>${items.map(i=>`<div class="item"><div>• ${esc(i.name)}</div><div>CHF</div><div class="amt">${Number(i.price||0).toFixed(2)}</div></div>`).join('')}</div>
 <div class="line"></div><div class="total"><div>Betrag:</div><div class="cur">CHF</div><div class="amt">${Number(d.total||0).toFixed(2)}</div></div>
 <div class="pay"><span>Zahlungsart:</span><b>${esc(d.payment||'Barzahlung')}</b></div><div class="mwst">Nicht MWST-pflichtig</div><div class="line"></div>
 <div class="thanks"><div class="heart">♡</div><div class="script">Vielen Dank für Ihren Besuch!</div><div class="sub">Wir freuen uns, Sie bald wieder begrüssen zu dürfen.</div></div>`;
}catch(e){console.error(e);fail('Quittung konnte nicht geladen werden','Bitte versuchen Sie es später erneut.')}})();
</script></body></html>
